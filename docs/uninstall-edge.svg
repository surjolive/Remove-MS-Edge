<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Uninstall Microsoft Edge easily</title>
  <desc id="desc">Blue promotional banner with Microsoft Edge logo and an uninstall menu.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0864d8"/>
      <stop offset="1" stop-color="#123779"/>
    </linearGradient>
    <linearGradient id="edge-green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#08a4df"/>
      <stop offset="1" stop-color="#59df62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".35"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#fff" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <path d="M930 0h350v350H930z" fill="url(#dots)" opacity=".75"/>
  <path d="M0 580h260v140H0z" fill="url(#dots)" opacity=".7"/>

  <text x="48" y="168" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="900" stroke="#090909" stroke-width="10" paint-order="stroke">Uninstall EDGE</text>
  <text x="934" y="168" fill="#ffc65d" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" stroke="#090909" stroke-width="9" paint-order="stroke">- Easily</text>

  <g transform="translate(74 286)" filter="url(#shadow)">
    <circle cx="138" cy="138" r="132" fill="#0879c9" opacity=".92"/>
    <path d="M254 132c-11-58-64-102-125-102C69 30 22 68 9 121c36-35 86-39 123-16 33 20 51 54 50 88-2 36-25 70-63 88 60 15 121-8 135-64 4-15 4-32 0-49z" fill="url(#edge-green)"/>
    <path d="M9 121c-3 45 22 88 64 111 37 20 79 18 111-5-42 8-82-11-98-45-18-38 1-83 42-99-39-26-89-14-119 38z" fill="#087bc7"/>
    <path d="M62 241c28 23 66 34 103 27 47-9 82-44 89-89-18 30-47 52-83 58-40 7-80-8-109-37z" fill="#d8e6eb" opacity=".9"/>
  </g>

  <g transform="translate(486 326)" filter="url(#shadow)">
    <rect width="692" height="218" rx="4" fill="#f8f8f8"/>
    <rect x="18" y="18" width="656" height="78" rx="3" fill="#fff" stroke="#e3e3e3"/>
    <circle cx="57" cy="57" r="22" fill="url(#edge-green)"/>
    <path d="M44 60c5-13 22-17 32-7-2-11-12-18-23-17-11 1-18 10-19 20 3-3 7-4 10-3z" fill="#087bc7"/>
    <text x="93" y="51" fill="#444" font-family="Arial, Helvetica, sans-serif" font-size="20">Microsoft Edge</text>
    <text x="93" y="77" fill="#777" font-family="Arial, Helvetica, sans-serif" font-size="16">100.0.1185.36  |  Microsoft Corporation  |  3/2/2024</text>
    <text x="641" y="54" fill="#555" font-family="Arial, Helvetica, sans-serif" font-size="25">⋯</text>
    <rect x="258" y="95" width="397" height="105" rx="16" fill="#fff" stroke="#e4e4e4"/>
    <text x="286" y="137" fill="#444" font-family="Arial, Helvetica, sans-serif" font-size="22">Modify</text>
    <text x="286" y="183" fill="#444" font-family="Arial, Helvetica, sans-serif" font-size="22">Uninstall</text>
  </g>
</svg>
